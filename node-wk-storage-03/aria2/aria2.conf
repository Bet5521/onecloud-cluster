# aria2 配置文件
# 完整文档: https://aria2.github.io/manual/en/html/aria2c.html

## 基本设置
dir=/downloads
log=/config/aria2.log
log-level=notice
file-allocation=none
continue=true
max-overall-download-limit=0
max-single-download-limit=0
max-overall-upload-limit=0
max-single-upload-limit=0

## 连接设置
max-connection-per-server=16
min-split-size=1M
split=16
enable-dht=true
enable-peer-exchange=true
peer-id-prefix=-TR2970-
user-agent=Transmission/2.97

## BitTorrent 设置
bt-enable-lpd=true
bt-max-peers=200
bt-tracker=

## RPC 设置
enable-rpc=true
rpc-allow-origin-all=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-secret=changeme_aria2_token

## 协议设置
enable-http=true
enable-https=true
enable-ftp=true
enable-sftp=false
http-request-timeout=120
connect-timeout=30
retry-wait=5
max-tries=5
timeout=60
use-head=true

## 安全设置
check-certificate=false
allow-overwrite=false
auto-file-renaming=true
default-file-mode=0644
default-dirmode=0755

## 保存会话
save-session=true
save-session-interval=60
input-file=/config/aria2.session
save-session-file=/config/aria2.session

## 磁盘缓存
disk-cache=64M
