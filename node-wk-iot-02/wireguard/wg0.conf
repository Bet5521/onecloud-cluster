# WireGuard - NODE-02 (IoT Core) Peer 配置
# 这个文件应在 NODE-01 生成密钥后填充

[Interface]
Address = 10.8.0.102/32
PrivateKey = __YOUR_PRIVATE_KEY_HERE__
# 使用 systemd-resolved 或本地 DNS
DNS = 10.8.0.101, 1.1.1.1

# NODE-01 (Edge Gateway)
[Peer]
PublicKey = __PEER01_PUBLIC_KEY__
AllowedIPs = 10.8.0.101/32, 192.168.1.101/32
Endpoint = ${DOMAIN}:51820
PersistentKeepalive = 25

# NODE-03 (Storage)
[Peer]
PublicKey = __PEER03_PUBLIC_KEY__
AllowedIPs = 10.8.0.103/32, 192.168.1.103/32
Endpoint = 192.168.1.103:51820
PersistentKeepalive = 25
